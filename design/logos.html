<title>Logos ASSMATIA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Planche de propositions : grille de cartes carrées, chaque logo sur son fond d'application. */
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#2E2A4F; --muted:#6B6690; --line:#EFE6FA;
  --coral:#FF7A6B; --sun:#FFC24B; --mint:#4CC9A6; --sky:#5DB7F0; --lav:#7B5CE6; --pink:#FF8FB8;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1A2E;--card:#26233D;--ink:#F4F1FF;--muted:#B5AFD6;--line:#37325A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1A2E;--card:#26233D;--ink:#F4F1FF;--muted:#B5AFD6;--line:#37325A;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:24px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);font-size:16px;max-width:62ch;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px;display:grid;gap:12px;align-content:start}
.mark{aspect-ratio:1;max-width:100%;border-radius:22px;display:grid;place-items:center;background:var(--bg)}
.mark svg{width:72%;height:72%;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.card:hover .mark svg{transform:scale(1.07) rotate(-3deg)}
.row{display:flex;align-items:center;gap:10px}
.num{font-family:var(--display);font-weight:600;font-size:13px;min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--lav)}
.name{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.desc{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.icons{display:flex;gap:10px;align-items:center}
.icons span{font-size:12px;color:var(--muted);font-weight:700}
.mini{width:44px;height:44px;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.mini svg{width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.mark svg{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>10 logos pour ASSMATIA</h1>
    <p class="lead">Chaque proposition est montrée en grand, puis en icône d'application à taille réelle (44&nbsp;px). Donnez-moi le numéro retenu : je l'intègre comme icône Android et dans l'écran de connexion.</p>
  </header>
  <div class="grid" id="grid"></div>
</div>

<script>
const L = [
 {n:"Soleil câlin", d:"Un soleil souriant qui veille : chaleur, bienveillance, journée qui commence.",
  s:`<circle cx="60" cy="60" r="58" fill="#FFF1D6"/><g stroke="#FFC24B" stroke-width="7" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="60" y1="14" x2="60" y2="24" transform="rotate(${a} 60 60)"/>`).join('')}</g><circle cx="60" cy="60" r="28" fill="#FFC24B"/><circle cx="50" cy="56" r="3.5" fill="#2E2A4F"/><circle cx="70" cy="56" r="3.5" fill="#2E2A4F"/><path d="M48 66q12 11 24 0" stroke="#2E2A4F" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="44" cy="65" r="4" fill="#FF8FB8"/><circle cx="76" cy="65" r="4" fill="#FF8FB8"/>`},
 {n:"Maison-cœur", d:"Une maison dont la porte est un cœur : l'accueil à domicile, en toute confiance.",
  s:`<rect width="120" height="120" rx="30" fill="#5DB7F0"/><path d="M60 24 98 56v38a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6V56z" fill="#fff"/><path d="M60 24 98 56" stroke="#FF7A6B" stroke-width="8" stroke-linecap="round"/><path d="M60 24 22 56" stroke="#FF7A6B" stroke-width="8" stroke-linecap="round"/><path d="M60 92s-16-9-16-20a8 8 0 0 1 16-3 8 8 0 0 1 16 3c0 11-16 20-16 20z" fill="#FF7A6B"/>`},
 {n:"Cubes ABC", d:"Trois cubes de jeu empilés : l'éveil, l'apprentissage, et un « A » pour ASSMATIA.",
  s:`<rect width="120" height="120" rx="30" fill="#FFF8EE"/><rect x="14" y="60" width="44" height="44" rx="10" fill="#4CC9A6"/><rect x="62" y="60" width="44" height="44" rx="10" fill="#5DB7F0"/><rect x="38" y="14" width="44" height="44" rx="10" fill="#FF7A6B" transform="rotate(-6 60 36)"/><text x="60" y="47" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="30" fill="#fff" transform="rotate(-6 60 36)">A</text><text x="36" y="92" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="26" fill="#fff">B</text><text x="84" y="92" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="26" fill="#fff">C</text>`},
 {n:"Main dans la main", d:"Une grande main et une petite main qui se tiennent : le lien entre la nounou et l'enfant.",
  s:`<rect width="120" height="120" rx="60" fill="#FFE3EC"/><path d="M26 74c0-18 10-34 24-34 8 0 12 6 12 12v22" fill="none" stroke="#7B5CE6" stroke-width="12" stroke-linecap="round"/><path d="M94 80c0-12-6-22-15-22-6 0-9 4-9 9v13" fill="none" stroke="#FF7A6B" stroke-width="9" stroke-linecap="round"/><circle cx="66" cy="80" r="11" fill="#FFC24B"/>`},
 {n:"Nuage-doudou", d:"Un nuage tout doux avec une étoile : la sieste, la sérénité, les rêves des petits.",
  s:`<rect width="120" height="120" rx="30" fill="#2E2A4F"/><path d="M34 82a16 16 0 0 1 2-32 22 22 0 0 1 42-6 18 18 0 0 1 8 38z" fill="#fff"/><circle cx="52" cy="66" r="3" fill="#2E2A4F"/><circle cx="70" cy="66" r="3" fill="#2E2A4F"/><path d="M55 74q6 5 12 0" stroke="#2E2A4F" stroke-width="3" fill="none" stroke-linecap="round"/><path d="m92 22 3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z" fill="#FFC24B"/><circle cx="24" cy="30" r="3" fill="#5DB7F0"/>`},
 {n:"Hochet calendrier", d:"Un hochet dont la boule est un calendrier : le planning et le jeu réunis.",
  s:`<rect width="120" height="120" rx="30" fill="#E6F7F1"/><rect x="54" y="72" width="12" height="36" rx="6" fill="#FFC24B"/><circle cx="60" cy="108" r="8" fill="#FF7A6B"/><rect x="26" y="16" width="68" height="62" rx="18" fill="#4CC9A6"/><rect x="26" y="16" width="68" height="18" rx="9" fill="#2E2A4F" opacity=".85"/>${[0,1,2].map(r=>[0,1,2].map(c=>`<circle cx="${43+c*17}" cy="${46+r*11}" r="4" fill="${r==1&&c==1?'#FF7A6B':'#fff'}"/>`).join('')).join('')}`},
 {n:"Petit pas", d:"Deux empreintes de pieds d'enfant qui avancent : grandir pas à pas, jour après jour.",
  s:`<rect width="120" height="120" rx="30" fill="#FFC24B"/><g fill="#fff"><ellipse cx="44" cy="74" rx="13" ry="20"/><circle cx="34" cy="48" r="4"/><circle cx="42" cy="45" r="4.5"/><circle cx="51" cy="47" r="4"/><circle cx="57" cy="52" r="3.5"/><ellipse cx="78" cy="52" rx="12" ry="18" transform="rotate(10 78 52)"/><circle cx="72" cy="27" r="3.5"/><circle cx="80" cy="25" r="4"/><circle cx="88" cy="28" r="3.5"/><circle cx="93" cy="33" r="3"/></g>`},
 {n:"Monogramme A", d:"Un « A » arrondi formé d'un toit et d'une balançoire : sobre, lisible en très petit.",
  s:`<rect width="120" height="120" rx="30" fill="#7B5CE6"/><path d="M30 96 60 24l30 72" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 66v14M76 66v14" stroke="#FFC24B" stroke-width="4" stroke-linecap="round"/><rect x="40" y="78" width="40" height="9" rx="4.5" fill="#FFC24B"/>`},
 {n:"Ourson gardien", d:"Une tête d'ourson bienveillante : le doudou qui rassure parents et enfants.",
  s:`<rect width="120" height="120" rx="60" fill="#FFF1D6"/><circle cx="34" cy="38" r="15" fill="#C98B5E"/><circle cx="86" cy="38" r="15" fill="#C98B5E"/><circle cx="34" cy="38" r="7" fill="#FF8FB8"/><circle cx="86" cy="38" r="7" fill="#FF8FB8"/><circle cx="60" cy="66" r="36" fill="#D9A273"/><ellipse cx="60" cy="78" rx="16" ry="12" fill="#FFE9D2"/><circle cx="46" cy="60" r="4" fill="#2E2A4F"/><circle cx="74" cy="60" r="4" fill="#2E2A4F"/><ellipse cx="60" cy="73" rx="5" ry="4" fill="#2E2A4F"/><path d="M54 82q6 5 12 0" stroke="#2E2A4F" stroke-width="3" fill="none" stroke-linecap="round"/>`},
 {n:"Arc-en-ciel", d:"Un arc-en-ciel posé sur deux nuages : la couleur, la joie, une palette pour chaque enfant.",
  s:`<rect width="120" height="120" rx="30" fill="#fff"/><g fill="none" stroke-linecap="round" stroke-width="10"><path d="M18 84a42 42 0 0 1 84 0" stroke="#FF7A6B"/><path d="M30 84a30 30 0 0 1 60 0" stroke="#FFC24B"/><path d="M42 84a18 18 0 0 1 36 0" stroke="#4CC9A6"/></g><g fill="#5DB7F0"><circle cx="18" cy="88" r="10"/><circle cx="30" cy="92" r="8"/><circle cx="102" cy="88" r="10"/><circle cx="90" cy="92" r="8"/></g>`},
];
const g=document.getElementById('grid');
L.forEach((l,i)=>{
  const svg=`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${l.n}">${l.s}</svg>`;
  const el=document.createElement('article');el.className='card';
  el.innerHTML=`<div class="mark">${svg}</div><div class="row"><span class="num">${i+1}</span><h2 class="name">${l.n}</h2></div><p class="desc">${l.d}</p><div class="icons"><div class="mini">${svg}</div><span>Icône sur l'écran d'accueil</span></div>`;
  g.appendChild(el);
});
</script>
